ruleset=🎥 流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Crunchyroll/Crunchyroll.list
ruleset=🎥 流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/HBOUSA/HBOUSA.list

; ---------- ⑤ TikTok ----------
ruleset=👯 TikTok,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/TikTok/TikTok.list

; ---------- ⑥ 台湾专属(台区独有APP/电视台, 手动点选台湾节点) ----------
ruleset=🇹🇼 台湾专属,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/KKTV/KKTV.list
ruleset=🇹🇼 台湾专属,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/HamiVideo/HamiVideo.list
ruleset=🇹🇼 台湾专属,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/LiTV/LiTV.list
ruleset=🇹🇼 台湾专属,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Bahamut/Bahamut.list
ruleset=🇹🇼 台湾专属,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/friDay/friDay.list
ruleset=🇹🇼 台湾专属,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/VidolTV/VidolTV.list
ruleset=🇹🇼 台湾专属,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ATTWatchTV/ATTWatchTV.list
ruleset=🇹🇼 台湾专属,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/TaiWanGood/TaiWanGood.list
ruleset=🇹🇼 台湾专属,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/PChomeTW/PChomeTW.list
