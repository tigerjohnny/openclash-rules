; ---------- ⑦ 美国专属(美国独占流媒体, 走美国) ----------
ruleset=🇺🇸 美国专属,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/HuluUSA/HuluUSA.list
ruleset=🇺🇸 美国专属,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ParamountPlus/ParamountPlus.list
ruleset=🇺🇸 美国专属,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Peacock/Peacock.list

; ---------- ⑧ 日本专属(日本独占流媒体, 走日本) ----------
ruleset=🇯🇵 日本专属,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/DMM/DMM.list
ruleset=🇯🇵 日本专属,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Abema/Abema.list
ruleset=🇯🇵 日本专属,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Niconico/Niconico.list

; ---------- ⑨ 韩国专属(韩国独占流媒体, 走韩国) ----------
ruleset=🇰🇷 韩国专属,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/NaverTV/NaverTV.list

; ---------- ⑩ 兜底: 未命中全部 → 🌍 国外 ----------
ruleset=🌍 国外,[]FINAL

; ---------- ③ AI组: 美国主, 日本兜底(保持自动,不加手动) ----------
custom_proxy_group=✨ AI`fallback`[]🇺🇸 美国-自动`[]🇯🇵 日本-自动`http://www.gstatic.com/generate_204`300,5,100

; ---------- ④ 流媒体: 新加坡为主, 可切所有-自动/所有-手动 ----------
custom_proxy_group=🎥 流媒体`select`[]🇸🇬 新加坡-自动`[]🌐 所有-自动`[]🌐 所有-手动

; ---------- ⑤ TikTok: 非香港区域自动(挑最低延迟) ----------
custom_proxy_group=👯 TikTok`url-test`[台湾|台灣|新加坡|日本|美国|韩国|TW|SG|JP|US|KR|USA|Korea]`http://www.gstatic.com/generate_204`180,5,100

; ---------- ⑥ 台湾专属: 台湾-自动(默认) + 所有台湾节点手动点选 ----------
custom_proxy_group=🇹🇼 台湾专属`select`[]🇹🇼 台湾-自动`[台湾|台灣|TW|Taiwan|TaiWan]

; ---------- ⑦ 美国专属: 美国-自动(默认) + 所有美国节点手动点选 ----------
custom_proxy_group=🇺🇸 美国专属`select`[]🇺🇸 美国-自动`[美国|US|USA|美西|美东|洛杉矶|旧金山|硅谷|United States|UnitedStates]

; ---------- ⑧ 日本专属: 日本-自动(默认) + 所有日本节点手动点选 ----------
custom_proxy_group=🇯🇵 日本专属`select`[]🇯🇵 日本-自动`[日本|JP|Japan|东京|大阪|埼玉]

; ---------- ⑨ 韩国专属: 韩国-自动(默认) + 所有韩国节点手动点选 ----------
custom_proxy_group=🇰🇷 韩国专属`select`[]🇰🇷 韩国-自动`[韩国|KR|Korea|KOR]

; ---------- ⑩ 国外: 兜底, 只分两块(所有-自动/所有-手动) ----------
custom_proxy_group=🌍 国外`select`[]🌐 所有-自动`[]🌐 所有-手动

; ---------- 国家节点组 ----------
custom_proxy_group=🇺🇸 美国-自动`url-test`[美国|US|USA|美西|美东|洛杉矶|旧金山|硅谷|United States|UnitedStates]`http://www.gstatic.com/generate_204`180,5,100
custom_proxy_group=🇯🇵 日本-自动`url-test`[日本|JP|Japan|东京|大阪|埼玉]`http://www.gstatic.com/generate_204`180,5,100
custom_proxy_group=🇸🇬 新加坡-自动`url-test`[新加坡|SG|Singapore|狮城]`http://www.gstatic.com/generate_204`180,5,100
custom_proxy_group=🇹🇼 台湾-自动`url-test`[台湾|台灣|TW|Taiwan|TaiWan]`http://www.gstatic.com/generate_204`180,5,100
custom_proxy_group=🇭🇰 香港-自动`url-test`[香港|HK|HongKong|Hong Kong]`http://www.gstatic.com/generate_204`180,5,100
custom_proxy_group=🇰🇷 韩国-自动`url-test`[韩国|KR|Korea|KOR]`http://www.gstatic.com/generate_204`180,5,100
custom_proxy_group=🌐 所有-自动`url-test`[.*]`http://www.gstatic.com/generate_204`180,5,100

; ---------- 手动组: 所有节点手动挑 ----------
custom_proxy_group=🌐 所有-手动`select`[.*]

enable_rule_generator=true
overwrite_original_rules=true
